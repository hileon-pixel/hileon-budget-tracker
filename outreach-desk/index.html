<style>
/* Layout: navy desk header with today's count, then one column of prospect rows; the next action is the only filled button in each row. */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --ink:#16283B; --soft:#56677A; --line:#D7DFE8;
  --accent:#0A8F65; --on-accent:#FFFFFF; --head:#10243A; --head-ink:#FFFFFF; --head-soft:#B4C4D4; --head-line:#34506A;
  --warn:#9A5B00; --warn-bg:#FFF3DC; --chip:#E7EEF5;
  --display:"Outfit","Trebuchet MS",sans-serif; --body:"Hanken Grotesk","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1622; --surface:#132436; --ink:#E7EEF5; --soft:#9FB1C4; --line:#283C51;
  --accent:#2BD890; --on-accent:#06281C; --head:#0F2236; --head-ink:#FFFFFF; --head-soft:#B4C4D4; --head-line:#34506A;
  --warn:#F2C277; --warn-bg:#3A2C12; --chip:#1D3147; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1622; --surface:#132436; --ink:#E7EEF5; --soft:#9FB1C4; --line:#283C51;
  --accent:#2BD890; --on-accent:#06281C; --head:#0F2236; --head-ink:#FFFFFF; --head-soft:#B4C4D4; --head-line:#34506A;
  --warn:#F2C277; --warn-bg:#3A2C12; --chip:#1D3147; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body)}
.gut{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{background:var(--head);color:var(--head-ink)}
header .gut{padding-block:22px 20px}
h1{font:800 26px/1.1 var(--display);margin:0}
.today{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:16px}
.today b{font:800 44px/1 var(--display);font-variant-numeric:tabular-nums}
.today span{color:var(--head-soft)}
.meter{height:6px;border-radius:3px;background:var(--head-line);margin-top:12px;overflow:hidden}
.meter i{display:block;height:100%;background:#2BE89B;width:0;transition:width .3s}
.sets{display:flex;gap:10px 18px;flex-wrap:wrap;margin-top:16px;font-size:13.5px;color:var(--head-soft)}
.sets label{display:flex;align-items:center;gap:6px}
.sets select{background:transparent;border:1px solid var(--head-line);border-radius:7px;padding:4px 6px;color:var(--head-ink)}
.sets option{color:#16283B}

.counts{display:flex;flex-wrap:wrap;gap:6px 22px;padding-block:16px 4px;font-size:13.5px;color:var(--soft)}
.counts b{color:var(--ink);font-variant-numeric:tabular-nums;margin-right:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:10px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--soft);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
#q{width:100%;margin-top:14px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.note{margin-top:14px;padding:10px 12px;border-radius:9px;background:var(--warn-bg);color:var(--warn);font-size:13.5px}
.sec{font:700 16px var(--display);margin:22px 0 2px}
.sec small{font:400 13px var(--body);color:var(--soft);margin-left:8px}

.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px}
.row.off{opacity:.62}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.top>div{min-width:0}
.org{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--soft)}
.addr{font-size:13.5px;user-select:all;overflow-wrap:anywhere}
.step{flex:none;font-size:12.5px;font-weight:600;background:var(--chip);border-radius:6px;padding:3px 8px;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.btn{display:inline-block;border:1px solid var(--line);background:transparent;border-radius:9px;padding:8px 13px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--soft)}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.done{border-color:var(--accent);color:var(--accent)}
.link{background:none;border:0;padding:6px 4px;color:var(--soft);font-size:13.5px;cursor:pointer;text-decoration:underline}
details{margin-top:10px}
summary{cursor:pointer;font-size:13.5px;color:var(--soft)}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:400 13.5px/1.5 var(--body);background:var(--bg);border-radius:9px;padding:12px;margin:8px 0 0;user-select:text}
.empty{padding:34px 0;color:var(--soft);text-align:center}
.empty b{display:block;font:700 20px var(--display);color:var(--ink);margin-bottom:4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--head);color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
#toast button{background:none;border:0;color:#2BE89B;font-weight:700;cursor:pointer}
main{padding-bottom:90px}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}
</style>

/* ---- dates and steps ---- */
const pad=n=>String(n).padStart(2,"0");
const dayStr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY=dayStr(new Date());
function addDays(s,n){const [y,m,d]=s.split("-").map(Number);return dayStr(new Date(y,m-1,d+n));}
function nice(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{day:"numeric",month:"short"});}
const STEP=[null,"First email","Follow-up","Last note"];

/* what comes next for a prospect: {n:1|2|3, due:"YYYY-MM-DD"} or null when finished/stopped */
function next(st){
  if(st.replied||st.skip) return null;
  if(!st.s1) return {n:1,due:TODAY};
  if(!st.s2) return {n:2,due:addDays(st.s1,3)};
  if(!st.s3){const a=addDays(st.s1,9),b=addDays(st.s2,3);return {n:3,due:a>b?a:b};}
  return null;
}
function body(r,n){return T[r.l]["e"+n](r);}

/* ---- state ---- */
let S={}, ready=false, tab="today", db=null, local=false, lastUndo=null;
const LS="hileon-desk-status";
const prefs=(()=>{try{return JSON.parse(localStorage.getItem("hileon-desk-prefs"))||{}}catch(e){return {}}})();
function savePrefs(){try{localStorage.setItem("hileon-desk-prefs",JSON.stringify(prefs))}catch(e){}}
const st=id=>S[id]||{};
const chains={};
function save(id,val){
  S[id]=val; render();
  if(local){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){} return;}
  if(!db) return;
  const ref=db.doc("status/"+id);
  chains[id]=(chains[id]||Promise.resolve()).then(()=>ref.set(val)).catch(e=>{
    note("That change could not be saved"+(e&&e.code==="unavailable"?" (no connection). Try again in a moment.":". Reload the page and try again."));
  });
}
function note(t){const n=document.getElementById("note");n.textContent=t;n.hidden=!t;}

/* ---- render ---- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function composeUrl(r,n){
  const su=encodeURIComponent(T[r.l].subj), bo=encodeURIComponent(body(r,n)), to=encodeURIComponent(r.e);
  return (prefs.mail==="outlook")
    ? `https://outlook.live.com/mail/0/deeplink/compose?to=${to}&subject=${su}&body=${bo}`
    : `https://mail.google.com/mail/u/${prefs.acct||0}/?view=cm&fs=1&to=${to}&su=${su}&body=${bo}`;
}
function rowHtml(r,mode){
  const s=st(r.id), nx=next(s);
  const meta=`${esc(r.c)} · Wave ${r.w} · ${T[r.l].name}`;
  let chip, acts="", prev="";

  if(nx && (mode==="today"||nx.due<=TODAY)){

    }else{
      if(prefs.mail!=="outlook") acts+=`<a class="btn go" target="_blank" rel="noopener" href="https://mail.google.com/mail/u/${prefs.acct||0}/#search/${encodeURIComponent("to:"+r.e)}">Find the thread</a>`;
      acts+=`<button class="btn${prefs.mail==="outlook"?" go":""}" data-a="copy" data-id="${r.id}" data-n="${nx.n}">Copy reply text</button>`;
    }
    acts+=`<button class="btn done" data-a="sent" data-id="${r.id}" data-n="${nx.n}">Mark sent</button>`;
    prev=`<details><summary>${nx.n===1?"Read the email":"Read the reply"}${nx.n>1?" (send it as a reply in the same thread)":""}</summary><pre>${nx.n===1?"Subject: "+esc(T[r.l].subj)+"\n\n":""}${esc(body(r,nx.n))}</pre></details>`;
  }
  if(s.s1&&!s.replied&&!s.skip) acts+=`<button class="link" data-a="replied" data-id="${r.id}">They replied</button>`;
  if(!s.replied) acts+=`<button class="link" data-a="skip" data-id="${r.id}">${s.skip?"Put back":"Skip (bounced or wrong)"}</button>`;
  if(s.replied) acts+=`<button class="link" data-a="replied" data-id="${r.id}">Undo replied</button>`;
  if(mode==="all"&&(s.s1)&&!s.replied&&!s.skip) acts+=`<button class="link" data-a="back" data-id="${r.id}">Undo last sent</button>`;
  const hist=[s.s1&&"first email "+nice(s.s1),s.s2&&"follow-up "+nice(s.s2),s.s3&&"last note "+nice(s.s3)].filter(Boolean).join(", ");
  return `<div class="row${(s.replied||s.skip||(!nx&&s.s3))?" off":""}">
    <div class="top"><div><div class="org">${esc(r.o)}</div><div class="meta">${meta}</div><div class="addr">${esc(r.e)}</div></div><span class="step">${chip}</span></div>
    ${hist?`<div class="meta" style="margin-top:6px">Sent: ${hist}</div>`:""}
    <div class="acts">${acts}</div>${prev}</div>`;
}
function render(){
  const cap=+(prefs.cap||30);
  let sentToday=0,c={none:0,prog:0,fin:0,rep:0,skip:0};
  const due=[],fresh=[];
  for(const r of P){
    const s=st(r.id);
    for(const k of ["s1","s2","s3"]) if(s[k]===TODAY) sentToday++;
    if(s.replied) c.rep++; else if(s.skip) c.skip++; else if(!s.s1) c.none++; else if(s.s3) c.fin++; else c.prog++;
    const nx=next(s); if(!nx) continue;
    if(nx.n===1) fresh.push(r); else if(nx.due<=TODAY) due.push([nx.due,r]);
  }
  document.getElementById("nToday").textContent=sentToday;
  document.getElementById("capTxt").textContent=`of ${cap} sent today`;
  document.getElementById("bar").style.width=Math.min(100,100*sentToday/cap)+"%";
  document.getElementById("counts").innerHTML=`<span><b>${c.none}</b>not started</span><span><b>${c.prog}</b>in progress</span><span><b>${c.fin}</b>finished</span><span><b>${c.rep}</b>replied</span><span><b>${c.skip}</b>skipped</span>`;
  document.getElementById("acctL").hidden=prefs.mail==="outlook";
  const list=document.getElementById("list");
  if(!ready){return;}
  let h="";
  if(tab==="today"){
    due.sort((a,b)=>a[0]<b[0]?-1:1);
    const left=Math.max(0,cap-sentToday);
    const fu=due.slice(0,left).map(x=>x[1]);
    const nf=fresh.slice(0,Math.max(0,left-fu.length));
    if(fu.length) h+=`<div class="sec">Follow-ups due<small>reply in the same thread</small></div>`+fu.map(r=>rowHtml(r,"today")).join("");
    if(nf.length) h+=`<div class="sec">First emails<small>Wave ${nf[0].w}${nf[nf.length-1].w!==nf[0].w?" to "+nf[nf.length-1].w:""}, best fits first</small></div>`+nf.map(r=>rowHtml(r,"today")).join("");
    if(!h){
      if(left===0&&(due.length||fresh.length)) h=`<div class="empty"><b>Done for today</b>${due.length+fresh.length} more are waiting. Come back tomorrow, or raise the daily limit at the top.</div>`;
      else if(c.prog) h=`<div class="empty"><b>Nothing due today</b>The next follow-ups will appear here when their day comes.</div>`;
      else h=`<div class="empty"><b>All done</b>Every organisation on the list has been contacted.</div>`;
    }
  }else{
    const q=document.getElementById("q").value.trim().toLowerCase();
    const rows=P.filter(r=>!q||(r.o+" "+r.c+" "+r.e).toLowerCase().includes(q));
    h=rows.length?rows.map(r=>rowHtml(r,"all")).join(""):`<div class="empty"><b>No match</b>Try a shorter search.</div>`;
  }
  list.innerHTML=h;
}

/* ---- actions ---- */
let toastTimer;
function toast(t,undo){
  lastUndo=undo||null;
  document.getElementById("toastT").textContent=t;
  document.getElementById("undo").hidden=!undo;
  document.getElementById("toast").hidden=false;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{document.getElementById("toast").hidden=true},7000);
}
document.getElementById("undo").onclick=()=>{if(lastUndo){lastUndo();lastUndo=null;document.getElementById("toast").hidden=true;}};
document.getElementById("list").addEventListener("click",ev=>{
  const b=ev.target.closest("[data-a]"); if(!b) return;
  const id=b.dataset.id, r=P.find(x=>x.id===id), old={...st(id)}, a=b.dataset.a;
  if(a==="copy"){
    const n=+b.dataset.n, txt=body(r,n);
    const ok=()=>toast(n===1?"Email text copied":"Reply text copied. Paste it as a reply in the same thread.");
    const fail=()=>{const d=b.closest(".row").querySelector("details");if(d){d.open=true;const pre=d.querySelector("pre");const rg=document.createRange();rg.selectNodeContents(pre);const sel=getSelection();sel.removeAllRanges();sel.addRange(rg);}toast("Copying is blocked here. The text is selected below, copy it from there.");};
    try{navigator.clipboard.writeText(txt).then(ok,fail)}catch(e){fail()}
    return;
  }
  if(a==="sent"){const n=+b.dataset.n; save(id,{...old,["s"+n]:TODAY}); toast(`${STEP[n]} to ${r.o} marked sent`,()=>save(id,old));}
  if(a==="replied"){save(id,{...old,replied:!old.replied}); toast(old.replied?"Put back in the sequence":`${r.o} replied. No more emails will be queued.`,()=>save(id,old));}
  if(a==="skip"){save(id,{...old,skip:!old.skip}); toast(old.skip?"Put back on the list":`${r.o} skipped`,()=>save(id,old));}
  if(a==="back"){const v={...old}; for(const k of ["s3","s2","s1"]) if(v[k]){delete v[k];break;} save(id,v); toast("Last sent mark removed",()=>save(id,old));}
});
for(const [id,key] of [["cap","cap"],["mail","mail"],["acct","acct"]]){
  const el=document.getElementById(id); if(prefs[key]!=null) el.value=prefs[key];
  el.onchange=()=>{prefs[key]=el.value;savePrefs();render();};
}
function setTab(t){tab=t;document.getElementById("tToday").setAttribute("aria-selected",t==="today");document.getElementById("tAll").setAttribute("aria-selected",t==="all");document.getElementById("q").hidden=t!=="all";render();}
document.getElementById("tToday").onclick=()=>setTab("today");
document.getElementById("tAll").onclick=()=>setTab("all");
document.getElementById("q").oninput=render;

/* ---- storage: the artifact's database, or this browser if that is not available ---- */
function useLocal(msg){
  local=true; try{S=JSON.parse(localStorage.getItem(LS))||{}}catch(e){S={}}
  ready=true; note(msg); render();
}
async function start(){
  render();
  let d=null; try{d=await window.claude?.use?.("db")}catch(e){}
  if(!d){useLocal("Progress is saved in this browser on this device only. It will not sync to other devices. Do not clear this browser's site data if you want to keep your campaign history.");return;}
  db=d;
  const slow=setTimeout(()=>{if(!ready) note("Your saved progress can't be reached yet. Don't mark anything until it loads.");},10000);
  db.collection("status").onSnapshot(snap=>{
    const m={}; for(const doc of snap.docs) m[doc.id]={...doc.data()};
    S=m; ready=true;
    if(!snap.metadata.fromCache){clearTimeout(slow); note("");}
    render();
  },()=>{clearTimeout(slow); if(!ready) useLocal("Your saved progress could not be loaded. Changes are now being kept in this browser on this device only. Reload to try again."); else note("Lost contact with your saved progress. Reload the page before marking anything else.");});
}
start();
</script>
